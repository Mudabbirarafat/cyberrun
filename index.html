<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A 3D endless runner in the browser. Three lanes, a city at night, and a track generated as you run." />

    <!-- Without these the link pastes into a message as a bare URL. The
         domain is cyberrun-tau, not cyberrun: Vercel assigns a suffix when
         the plain subdomain is already taken, and pointing these at the
         plain one would advertise somebody else's site. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cyberrun-tau.vercel.app/" />
    <meta property="og:title" content="CyberRun 3D" />
    <meta property="og:description" content="Three lanes. One mistake. An endless runner built on a game core that does not import Three.js." />
    <meta property="og:image" content="https://cyberrun-tau.vercel.app/preview.jpg" />
    <meta property="og:image:alt" content="A neon-lit three-lane road at night with obstacles ahead of the runner." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CyberRun 3D" />
    <meta name="twitter:description" content="An endless runner in a browser tab, with a simulation that is tested without a screen." />
    <meta name="twitter:image" content="https://cyberrun-tau.vercel.app/preview.jpg" />

    <title>CyberRun 3D — endless runner in the browser</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
